<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a181b" />
    <title>Sin conexión · El VIP de MM</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0a181b;
        color: #e8e4d8;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #f2b632;
      }
      p {
        margin: 0;
        max-width: 28ch;
        line-height: 1.5;
        opacity: 0.8;
      }
      button {
        margin-top: 8px;
        padding: 12px 24px;
        border: 0;
        border-radius: 8px;
        background: #f2b632;
        color: #0a181b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Cuando vuelva la conexión, reintentá.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
